<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Night Shift — PhysGen race-component optimizer</title>
<style>
/* ============================================================
   DESIGN SYSTEM — tokens. One steel-neutral base, one blue
   accent, semantic pass/fail/warn. Stage hues are demoted to
   thin markers only. 8px spacing grid, fixed type scale.
   ============================================================ */
:root{
  --bg:#0b0e12; --surface:#12161c; --surface-2:#171c23; --surface-3:#1d232b;
  --line:#222a33; --line-2:#2f3946;
  --ink:#e9edf2; --ink-2:#a2acb9; --ink-3:#69747f;
  --accent:#4f8cff; --accent-2:#2f6fe0; --accent-soft:#12233f; --on-accent:#fff;
  --pass:#4bbf87; --pass-soft:#0f2a20; --fail:#ef6a5f; --fail-soft:#2a1512; --warn:#d99a3c; --warn-soft:#271d0e;
  --lab:#9b8cff; --factory:#e0a24a; --track:#46b3a4; --human:#5aa9ff;
  --steel:143,166,189; /* material fill (rgb) */
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r-sm:6px; --r:8px; --r-lg:12px;
  --sh:0 1px 2px rgba(0,0,0,.35),0 10px 30px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:grid;grid-template-columns:250px 1fr 344px;grid-template-rows:56px 1fr;
  grid-template-areas:"top top top" "nav main aside";height:100vh;overflow:hidden;
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px;border:2px solid var(--bg)}

/* type scale */
.t-label{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.t-meta{font-size:12px;color:var(--ink-3)}
.t-title{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
.t-sub{font-size:13px;color:var(--ink-2);margin:4px 0 0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
header{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 20px;
  border-bottom:1px solid var(--line);background:var(--surface)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.logo .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,var(--accent),#7a4fff);
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.logo small{display:block;font-size:10.5px;color:var(--ink-3);font-weight:500;letter-spacing:.04em}
.ctx{flex:1;display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden}
.ctx .sep{width:1px;height:26px;background:var(--line)}
.field{min-width:0}
.field .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.field .v{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .v.mono{color:var(--accent)}
.status{display:flex;gap:8px;align-items:center;flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:600}
.live{width:7px;height:7px;border-radius:50%;background:var(--pass)}
.live::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--pass);
  animation:ping 2.6s cubic-bezier(0,0,.2,1) infinite}
.live{position:relative}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(75,191,135,.5)}70%,100%{box-shadow:0 0 0 6px rgba(75,191,135,0)}}

/* ---------- left pipeline stepper ---------- */
nav{grid-area:nav;border-right:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;overflow:hidden}
.nav-head{padding:14px 16px 8px}
.steps{flex:1;overflow:auto;padding:4px 10px 10px}
.grp{margin-top:14px}
.grp:first-child{margin-top:4px}
.grp-label{display:flex;align-items:center;gap:8px;padding:0 6px 6px}
.grp-label .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.grp[data-stage="lab"] .grp-label .dot{background:var(--lab)}
.grp[data-stage="factory"] .grp-label .dot{background:var(--factory)}
.grp[data-stage="track"] .grp-label .dot{background:var(--track)}
.grp[data-stage="decision"] .grp-label .dot{background:var(--human)}
.step{display:flex;gap:11px;align-items:flex-start;padding:8px 8px;border-radius:var(--r);cursor:pointer;
  transition:background .12s;position:relative}
.step:hover{background:var(--surface-2)}
.step .idx{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);
  display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink-3);background:var(--surface);transition:.15s}
.step .st-t{font-size:12.5px;font-weight:500;color:var(--ink-2);line-height:1.3}
.step .st-d{font-size:11px;color:var(--ink-3)}
.step.active{background:var(--accent-soft)}
.step.active .idx{border-color:var(--accent);color:var(--accent)}
.step.active .st-t{color:var(--ink);font-weight:600}
.step.done .idx{background:var(--accent);border-color:var(--accent);color:#fff}
.step.done .st-t{color:var(--ink-2)}
.nav-foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;
  border-radius:var(--r-sm);font-size:13px;font-weight:600;border:1px solid var(--line-2);
  background:var(--surface-2);color:var(--ink);transition:.14s}
.btn:hover{border-color:var(--ink-3);background:var(--surface-3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn--primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn--primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn--flex{flex:1}
.btn--sm{height:32px;padding:0 12px;font-size:12px}

/* ---------- main ---------- */
main{grid-area:main;overflow:auto;padding:22px 26px 40px}
.step-head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.moment{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 9px}
.step-body{margin-top:20px}

/* cards / panels */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h .t-label{margin-right:auto}
.card-b{padding:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--r-sm);
  border:1px solid var(--line-2);color:var(--ink-2);background:var(--surface-2)}
.tag.pass{color:var(--pass);border-color:rgba(75,191,135,.4);background:var(--pass-soft)}
.tag.fail{color:var(--fail);border-color:rgba(239,106,95,.4);background:var(--fail-soft)}
.tag.warn{color:var(--warn);border-color:rgba(217,154,60,.4);background:var(--warn-soft)}
.tag.accent{color:var(--accent);border-color:rgba(79,140,255,.4);background:var(--accent-soft)}

/* key-value tables */
.kv{width:100%;border-collapse:collapse}
.kv td{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:top}
.kv td:first-child{color:var(--ink-3);width:42%}
.kv td:last-child{text-align:right;font-family:var(--mono)}
.kv tr:last-child td{border-bottom:0}

/* metric table */
.mt{width:100%;border-collapse:collapse;font-size:12.5px}
.mt th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mt th.r,.mt td.r{text-align:right}
.mt td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.mt tr:last-child td{border-bottom:0}
.mt tr.base td{color:var(--ink-3)}
.mt tr.win td{background:linear-gradient(90deg,var(--accent-soft),transparent)}
.meter{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;min-width:90px}
.meter > i{display:block;height:100%;border-radius:3px;background:var(--steel-c,rgb(var(--steel)))}
.pill-rank{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--surface-3);
  border:1px solid var(--line-2);border-radius:5px;padding:1px 7px}

/* bracket / density viewer */
.viewer{background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/14px 14px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/14px 14px,var(--surface-2);
  background-blend-mode:normal;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.viewer svg{display:block;width:100%;height:auto}
.viewer image{image-rendering:pixelated}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3)}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* candidate card */
.cand{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  transition:.18s;opacity:0;transform:translateY(6px);animation:rise .34s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.cand-h{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line)}
.cand-id{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-family:var(--mono);
  font-size:12px;background:var(--surface-3);border:1px solid var(--line-2);color:var(--ink)}
.cand-h .nm{font-weight:600;font-size:13px}
.cand-h .mm{font-size:11px;color:var(--ink-3)}
.cand-b{padding:12px 13px}
.cand-b .rat{font-size:11.5px;color:var(--ink-2);margin-top:9px;min-height:32px}
.cand.fail{border-color:rgba(239,106,95,.45)}
.cand.win{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--sh)}
.cand.muted{opacity:.5}
.spec{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

/* callout */
.callout{border:1px solid var(--line-2);border-left:3px solid var(--accent);border-radius:var(--r);
  background:var(--surface-2);padding:12px 14px;font-size:12.5px}
.callout.fail{border-left-color:var(--fail)}
.callout.pass{border-left-color:var(--pass)}
.callout .h{font-weight:600;margin-bottom:3px}
.callout.fail .h{color:var(--fail)} .callout.pass .h{color:var(--pass)}

/* lineage tree */
.lineage{font-family:var(--mono);font-size:12px;line-height:1.9}
.lineage .node{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border-radius:5px;border:1px solid var(--line-2);background:var(--surface-2)}
.lineage .node.fail{border-color:rgba(239,106,95,.4);color:var(--fail)}
.lineage .node.win{border-color:var(--accent);color:var(--accent)}
.lineage .arm{color:var(--ink-3);padding-left:18px}

/* ---------- right evidence ---------- */
aside{grid-area:aside;border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.aside-h{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.ev{flex:1;overflow:auto;padding:12px}
.ev-item{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:10px 12px;margin-bottom:9px;
  border-left:3px solid var(--line-2);animation:rise .28s both}
.ev-item.lab{border-left-color:var(--lab)} .ev-item.factory{border-left-color:var(--factory)}
.ev-item.track{border-left-color:var(--track)} .ev-item.human{border-left-color:var(--human)}
.ev-item.object{border-left-color:var(--ink-3)}
.ev-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.ev-who{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.ev-item.lab .ev-who{color:var(--lab)} .ev-item.factory .ev-who{color:var(--factory)}
.ev-item.track .ev-who{color:var(--track)} .ev-item.human .ev-who{color:var(--human)}
.ev-item.object .ev-who{color:var(--ink-2)}
.ev-msg{font-size:12px;color:var(--ink-2)}
.ev-msg b{color:var(--ink);font-weight:600}
.ev-hash{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.ev-hash .h{background:var(--surface-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.handbar{display:flex;align-items:center;gap:6px;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);padding:3px 0 9px}
.handbar .l{color:var(--ink-2)} .handbar .arw{color:var(--accent)}

/* approval */
.approve-box{display:flex;align-items:center;gap:16px;border:1px solid var(--accent);border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--accent-soft),var(--surface));padding:16px 18px;margin-top:16px}
.approve-box.done{border-color:var(--pass);background:linear-gradient(180deg,var(--pass-soft),var(--surface))}
.approve-box .txt{flex:1;font-size:13px}
.approve-box .txt b{color:var(--accent)} .approve-box.done .txt b{color:var(--pass)}

.muted{color:var(--ink-3)}
.small{font-size:11.5px}
@media (max-width:1240px){ body{grid-template-columns:220px 1fr} aside{display:none} }
@media (max-width:900px){ body{grid-template-columns:1fr} nav{display:none} }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="mark">NS</span><div>The Night Shift<small id="hSub">PhysGen optimizer</small></div></div>
  <div class="ctx">
    <div class="sep"></div>
    <div class="field"><div class="k">Assembly</div><div class="v" id="hAssembly">—</div></div>
    <div class="sep"></div>
    <div class="field"><div class="k">Target component</div><div class="v mono" id="hTarget">—</div></div>
    <div class="sep"></div>
    <div class="field"><div class="k">Design problem</div><div class="v mono" id="hDP">—</div></div>
  </div>
  <div class="status">
    <span class="chip"><span class="live"></span><b id="hNet">OFFLINE</b></span>
    <span class="chip" id="hMachine">GB10</span>
  </div>
</header>

<nav>
  <div class="nav-head"><div class="t-label">Pipeline</div></div>
  <div class="steps" id="steps"></div>
  <div class="nav-foot">
    <button class="btn btn--sm btn--flex" id="prev">← Back</button>
    <button class="btn btn--sm btn--primary btn--flex" id="next">Next →</button>
  </div>
</nav>

<main>
  <div class="step-head">
    <h1 class="t-title" id="stTitle">—</h1>
    <span id="stMoment"></span>
  </div>
  <p class="t-sub" id="stSub">—</p>
  <div class="step-body" id="stBody"></div>
</main>

<aside>
  <div class="aside-h"><span class="t-label">Evidence &amp; Claw handoffs</span></div>
  <div class="ev" id="ev"></div>
</aside>

<script>

/* =====================================================================
   GEOMETRY — deterministic density-field raster from a topology spec.
   PhysGen emits density fields; this renders them the same way the real
   .density.npy would draw. Metrics come from the run, not from here.
   ===================================================================== */
function distSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
  let t=l2?((px-ax)*dx+(py-ay)*dy)/l2:0; t=Math.max(0,Math.min(1,t));
  const x=ax+t*dx,y=ay+t*dy; return Math.hypot(px-x,py-y);
}
function inPoly(px,py,poly){
  let c=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/(yj-yi)+xi)) c=!c;
  } return c;
}
function coverage(px,py,s){ const d=distSeg(px,py,s.a[0],s.a[1],s.b[0],s.b[1]);
  if(d<=s.r) return 1; return Math.max(0,1-(d-s.r)/2.4); }
function densityAt(topo,px,py,P){
  if(!inPoly(px,py,P.outline)) return -1;               // outside part
  for(const m of P.protectedInterfaces) if(Math.hypot(px-m.c[0],py-m.c[1])<m.r-1.2) return -1; // bolt hole
  const k=P.keepOuts||[]; for(const ko of k){const[x,y,w,h]=ko.rect; if(px>=x&&px<=x+w&&py>=y&&py<=y+h) return -1;}
  if(topo.solid) return 1;
  let d=0; for(const s of (topo.struts||[])) d=Math.max(d,coverage(px,py,s));
  if(topo.island) d=Math.max(d,coverage(px,py,topo.island));
  return d;
}
function raster(topo,P,nx,ny){
  const cv=document.createElement('canvas'); cv.width=nx; cv.height=ny;
  const ctx=cv.getContext('2d'); const img=ctx.createImageData(nx,ny); const D=img.data;
  const sr=143,sg=166,sb=189;
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const px=(i+.5)/nx*P.domain.w, py=(j+.5)/ny*P.domain.h;
    const d=densityAt(topo,px,py,P); const o=(j*nx+i)*4;
    if(d<0){ D[o+3]=0; continue; }
    const a=d<0.16?0:0.28+0.72*d;                        // void cutoff + shading
    D[o]=sr; D[o+1]=sg; D[o+2]=sb; D[o+3]=Math.round(a*255);
  }
  ctx.putImageData(img,0,0); return cv.toDataURL();
}
/* full bracket viewer with annotations (mm coordinate space) */
function bracket(topo,opts={}){
  const P=viewProblem(); const W=P.domain.w,H=P.domain.h;
  const res=opts.res||{nx:80,ny:47};
  const url=raster(topo,P,res.nx,res.ny);
  const ov=opts.overlays!==false;
  let g='';
  // outline
  g+=`<polygon points="${P.outline.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--line-2)" stroke-width="0.7"/>`;
  if(ov){
    // keep-outs
    for(const ko of (P.keepOuts||[])){const[x,y,w,h]=ko.rect;
      g+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="var(--warn)" stroke-width="0.5" stroke-dasharray="1.6 1.2"/>`;}
    // supports + protected mounts
    for(const m of P.protectedInterfaces){
      g+=`<circle cx="${m.c[0]}" cy="${m.c[1]}" r="${m.r}" fill="var(--bg)" stroke="var(--accent)" stroke-width="0.7"/>`;
      g+=`<circle cx="${m.c[0]}" cy="${m.c[1]}" r="1.1" fill="var(--accent)"/>`;
      // support hatch
      g+=`<path d="M ${m.c[0]-4} ${m.c[1]+m.r+1.4} L ${m.c[0]+4} ${m.c[1]+m.r+1.4}" stroke="var(--accent)" stroke-width="0.5"/>`;
    }
    // loads
    for(const l of (P.loads||[])){const dx=l.dir[0]*9,dy=l.dir[1]*9;
      g+=`<line x1="${l.c[0]}" y1="${l.c[1]-dy}" x2="${l.c[0]}" y2="${l.c[1]}" stroke="var(--fail)" stroke-width="0.8"/>`+
         `<path d="M ${l.c[0]-1.8} ${l.c[1]-2.4} L ${l.c[0]} ${l.c[1]} L ${l.c[0]+1.8} ${l.c[1]-2.4} Z" fill="var(--fail)"/>`+
         `<text x="${l.c[0]+2.5}" y="${l.c[1]-4}" fill="var(--fail)" font-size="3.4" font-family="var(--mono)">${l.N}N</text>`;
    }
    // flaw marker
    if(topo.flaw){const f=topo.flaw;
      g+=`<circle cx="${f.at[0]}" cy="${f.at[1]}" r="4.2" fill="none" stroke="var(--fail)" stroke-width="0.8"/>`+
         `<text x="${f.at[0]+5}" y="${f.at[1]+1}" fill="var(--fail)" font-size="3.4" font-family="var(--mono)">${f.measuredMm} mm</text>`;
    }
  }
  const pad=4;
  return `<div class="viewer"><svg viewBox="${-pad} ${-pad} ${W+pad*2} ${H+pad*2}" preserveAspectRatio="xMidYMid meet">
    <image href="${url}" x="0" y="0" width="${W}" height="${H}"/>${g}</svg></div>`;
}

        <span><i style="background:var(--accent)"></i>protected mount / support</span>
        <span><i style="background:var(--fail)"></i>load</span>
        <span><i style="border:1px dashed var(--warn);background:transparent"></i>keep-out</span>
      </div></div></div></div>`;
}

/* ---- 3. lab ---- */
function stLab(){
  const cs=RUN.lab.candidates;
  evReset(); handoff('Object','Lab');
  ev('Lab','lab','candidate family',
    `Generated <b>${cs.length}</b> topology candidates from the baseline (budget ${RUN.problem.candidateBudget}). Each keeps parentage; Lab may be creative but cannot violate the request.`, null);
  cs.forEach(c=>ev('Lab','lab',c.id,`<b>${esc(c.label)}</b> — ${esc(c.method)}, material fraction ${c.materialFraction}.`,[c.artifactHash]));
  return `<div class="grid-3" id="labGrid">${cs.map((c,i)=>candCard(c,{delay:i})).join('')}</div>
    <div class="legend"><span><i style="background:rgb(var(--steel))"></i>retained material</span>
      <span><i style="background:var(--surface-3)"></i>removed</span>
      <span class="muted">density fields · SIMP/OAT, seed ${esc(RUN.problem.seedPolicy)}</span></div>`;
}
function candCard(c,o={}){
  const v=o.verdict, cls=[v==='fail'?'fail':'', o.win?'win':'', o.muted?'muted':''].join(' ');
  const badge=v?`<span class="tag ${v}" style="margin-left:auto">${v.toUpperCase()}</span>`
    :(o.rank?`<span class="pill-rank" style="margin-left:auto">rank ${o.rank}</span>`:'');
  return `<div class="cand ${cls}" style="animation-delay:${(o.delay||0)*90}ms">
    <div class="cand-h"><span class="cand-id">${esc(c.id)}</span>
      <div><div class="nm">${esc(c.label)}</div><div class="mm">${esc(c.method)} · frac ${c.materialFraction}</div></div>${badge}</div>
    <div class="cand-b">${bracket(c.topology,{overlays:o.overlays,res:{nx:56,ny:33}})}
      ${o.specExtra||`<div class="spec">${spec('parent '+c.parent)}</div>`}
      ${o.rat!==false?`<div class="rat">${esc(o.reason||c.rationale)}</div>`:''}
    </div></div>`;
}

/* ---- 4. factory ---- */
function stFactory(){
  const cs=RUN.lab.candidates, V={};
  RUN.factory.verdicts.forEach(x=>V[x.candidate]=x);
  evReset(); handoff('Lab','Factory');
  ev('Factory','factory','checks',`Running: ${RUN.factory.checks.map(esc).join(' · ')}.`,null);
  RUN.factory.verdicts.forEach(x=>ev('Factory','factory',x.verdict==='fail'?'✕ '+x.candidate:'✓ '+x.candidate,
    `<b>${x.candidate}</b> — ${esc(x.reason)}`,[x.artifactHash]));
  const fail=RUN.factory.verdicts.find(x=>x.verdict==='fail');
  return `<div class="grid-3">${cs.map(c=>{const x=V[c.id];
      return candCard(c,{verdict:x.verdict,overlays:x.verdict==='fail',reason:x.reason,res:{nx:56,ny:33}});}).join('')}</div>
    <div class="callout fail" style="margin-top:16px"><div class="h">Veto · ${esc(fail.candidate)} rejected</div>
      ${esc(fail.reason)}<div class="mono small muted" style="margin-top:6px">
      min feature ${fail.measured.minFeatureMm} mm (< ${fail.measured.minMm} mm) · disconnected bodies ${fail.measured.disconnectedBodies} · implicated ${fail.implicated.join(', ')}</div></div>`;
}

/* ---- 5. track ---- */
function stTrack(){
  const t=RUN.track, b=RUN.baseline.metrics;
  evReset(); handoff('Factory','Track');
  ev('Track','track','FEA fixture',`<b>${esc(t.fixture)}</b>`,['SF target '+t.sfTarget,'elapsed '+t.elapsedMs+' ms']);
  t.results.forEach(r=>ev('Track','track','rank '+r.rank,
    `<b>${r.candidate}</b>: ${r.metrics.massG} g, ${r.metrics.maxStressMPa} MPa, SF ${r.metrics.safetyFactor}${r.meetsTarget?'':' — below target'}.`,[r.tolerance]));
  ev('Track','track','→ feedback',`<b>${esc(RUN.feedback.target)}</b> ${esc(RUN.feedback.instruction)}`,null);
  const maxMass=Math.max(b.massG,...t.results.map(r=>r.metrics.massG));
  const maxStress=Math.max(...t.results.map(r=>r.metrics.maxStressMPa),b.maxStressMPa);
  const row=(id,m,meets,rank,base)=>`<tr class="${base?'base':''} ${meets&&!base?'win':''}">
    <td><b class="mono">${id}</b> ${rank?`<span class="pill-rank">rank ${rank}</span>`:base?'<span class="tag">baseline</span>':''}</td>
    <td class="r num">${m.massG} g</td><td style="width:120px">${metricBar(m.massG,maxMass)}</td>
    <td class="r num">${m.maxStressMPa} MPa</td>
    <td class="r num" style="color:${m.safetyFactor<t.sfTarget?'var(--fail)':'var(--pass)'}">SF ${m.safetyFactor}</td>
    <td class="r num">${m.compliance.toFixed(2)}</td></tr>`;
  return `<div class="card"><div class="card-h"><span class="t-label">Structural FEA — survivors vs baseline</span>
      <span class="tag">SF target ≥ ${t.sfTarget}</span></div>
    <div class="card-b" style="padding-top:6px"><table class="mt">
      <thead><tr><th>candidate</th><th class="r">mass</th><th></th><th class="r">max stress</th><th class="r">safety</th><th class="r">compliance</th></tr></thead>
      <tbody>
        ${row('baseline',b,true,null,true)}
        ${t.results.map(r=>row(r.candidate,r.metrics,r.meetsTarget,r.rank,false)).join('')}
      </tbody></table>
      <p class="small muted" style="margin:12px 4px 0">${esc(t.scoreDef)} Lower mass and compliance are better; safety factor must clear the target.</p>
    </div></div>
    <div class="callout" style="margin-top:14px"><div class="h">Feedback to Lab</div>
      ${esc(RUN.track.results.find(r=>!r.meetsTarget).flag)} <b>${esc(RUN.feedback.instruction)}</b></div>`;
}

/* ---- 6. revise ---- */
function stRevise(){
  const parent=RUN.lab.candidates.find(c=>c.id===RUN.revision.parent), r=RUN.revision;
  evReset(); handoff('Track','Lab');
  ev('Track','track','FeedbackEvent '+RUN.feedback.id,`<b>${esc(RUN.feedback.measured)}</b>`,[RUN.feedback.schemaVersion]);
  ev('Lab','lab','revised '+r.id,`New candidate <b>${r.id}</b> from parent <b>${r.parent}</b> — ${esc(r.evidence)}`,[r.artifactHash]);
  ev('Factory','factory','re-check',`${r.id} passes: min feature ${r.factory.minFeatureMm} mm, ${r.factory.bodies} body.`,null);
  ev('Track','track','re-score',`${r.id}: ${r.track.metrics.maxStressMPa} MPa, SF ${r.track.metrics.safetyFactor} (was SF ${parent.metricsSF||RUN.track.results.find(x=>x.candidate===r.parent).metrics.safetyFactor}).`,[r.track.tolerance]);
  const pm=RUN.track.results.find(x=>x.candidate===r.parent).metrics;
  return `<div class="grid-2">
      ${candCard(parent,{overlays:true,rat:false,specExtra:`<div class="spec">${spec('parent')}${tag('SF '+pm.safetyFactor,'fail')}${spec(pm.massG+' g')}</div>`})}
      ${candCard(r,{overlays:true,win:true,rat:false,specExtra:`<div class="spec">${spec('child of '+r.parent)}${tag('SF '+r.track.metrics.safetyFactor,'pass')}${spec(r.track.metrics.massG+' g')}</div>`})}
    </div>
    <div class="callout pass" style="margin-top:16px"><div class="h">Revision · ${r.parent} → ${r.id}</div>
      ${esc(r.rationale)} <b>Stress ${r.track.vsParent.stressPct}% and safety factor +${r.track.vsParent.sfDelta} vs parent</b>, now clearing the ${RUN.track.sfTarget} target — geometry changed from measured evidence, not a re-prompt.</div>`;
}

/* ---- 7. compare ---- */
function stCompare(){
  const c=RUN.compare;
  evReset();
  ev('Lab','lab','lineage',`Baseline → 3 proposals → 1 veto → 2 survivors → 1 revision. Failed candidate ${'C3'} kept visible, not erased.`,null);
  ev('Track','track','recommendation',`Measured winner: <b>${esc(c.recommendation)}</b> (lowest mass clearing the safety target).`,null);
  const kindTag={baseline:'',parent:'warn',failed:'fail',finalist:'accent'};
  const cols=c.columns.map(col=>{
    const win=col.id===c.recommendation;
    const m=col.metrics;
    const topo = col.id==='baseline'?RUN.baseline.topology
      : col.id==='C2r'?RUN.revision.topology
      : (RUN.lab.candidates.find(x=>x.id===col.id)||{}).topology;
    const code=col.id==='baseline'?'B':col.id;
    return `<div class="cand ${win?'win':''} ${col.kind==='failed'?'fail':''}">
      <div class="cand-h"><span class="cand-id">${esc(code)}</span>
        <div><div class="nm">${esc(col.label.split('·')[0].trim())}</div><div class="mm">${esc(col.state)}</div></div>
        ${win?'<span class="tag accent" style="margin-left:auto">pick</span>':(col.kind!=='baseline'?`<span class="tag ${kindTag[col.kind]}" style="margin-left:auto">${col.kind}</span>`:'')}</div>
      <div class="cand-b">${topo?bracket(topo,{overlays:false,res:{nx:44,ny:26}}):`<div class="viewer" style="height:96px;display:grid;place-items:center;color:var(--fail)" class="mono">veto</div>`}
      <table class="kv" style="margin-top:10px">
        <tr><td>parent</td><td>${esc(col.parent)}</td></tr>
        ${m?`<tr><td>mass</td><td>${m.massG} g</td></tr><tr><td>stress</td><td>${m.maxStressMPa} MPa</td></tr>
           <tr><td>safety</td><td style="color:${m.safetyFactor<c.sfTarget?'var(--fail)':'var(--pass)'}">${m.safetyFactor}</td></tr>`
          :`<tr><td>result</td><td style="color:var(--fail)">rejected pre-FEA</td></tr>`}
      </table></div></div>`;
  }).join('');
  return `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">${cols}</div>
    <div class="card" style="margin-top:16px"><div class="card-h"><span class="t-label">Lineage</span></div>
      <div class="card-b lineage">
        <div><span class="node">baseline</span></div>
        <div class="arm">├─ <span class="node">C1</span> <span class="muted">SIMP · rank 2 · finalist</span></div>
        <div class="arm">├─ <span class="node">C2</span> <span class="muted">OAT · below target</span> → <span class="node win">C2r</span> <span class="muted">gusset · rank 1 · pick</span></div>
        <div class="arm">└─ <span class="node fail">C3</span> <span class="muted">Factory veto — thin ligament 0.9 mm</span></div>
      </div></div>`;
}

/* ---- 8. approve ---- */
function stApprove(){
  const c=RUN.compare, sel=RUN.selection, fin=c.columns.find(x=>x.id===sel.candidate), base=c.columns[0];
  evReset();
  ev('Human','human','HumanSelection',`Blocking decision. The system reports evidence; it does <b>not</b> certify the part.`,[sel.schemaVersion]);
  const cmp=(a,b,unit,better)=>{const d=b-a;const good=better==='low'?d<0:d>0;
    return `<td class="r num">${a} ${unit}</td><td class="r num" style="color:${good?'var(--pass)':'var(--ink-3)'}">${b} ${unit}</td>`;}
  return `<div class="card"><div class="card-h"><span class="t-label">Baseline → finalist</span><span class="tag accent">${esc(sel.candidate)}</span></div>
    <div class="card-b" style="padding-top:6px"><table class="mt">
      <thead><tr><th>metric</th><th class="r">baseline</th><th class="r">${esc(sel.candidate)} finalist</th></tr></thead>
      <tbody>
        <tr><td>mass</td>${cmp(base.metrics.massG,fin.metrics.massG,'g','low')}</tr>
        <tr><td>max stress</td>${cmp(base.metrics.maxStressMPa,fin.metrics.maxStressMPa,'MPa','low')}</tr>
        <tr><td>safety factor</td>${cmp(base.metrics.safetyFactor,fin.metrics.safetyFactor,'','high')}</tr>
        <tr><td>protected interfaces</td><td class="r num">2/2</td><td class="r num" style="color:var(--pass)">2/2 intact</td></tr>
      </tbody></table></div></div>
    <div class="approve-box ${approved?'done':''}" id="approveBox">
      <div class="txt">${approved
        ? `<b>Promoted.</b> ${esc(sel.candidate)} selected by human review and recorded to the DesignRun. Proceed to export the artifact and evidence trail.`
        : `<b>Awaiting selection.</b> ${esc(sel.prompt)}`}</div>
      ${approved?'<span class="tag pass">✓ approved</span>'
        :`<button class="btn btn--primary" id="approveBtn">Approve &amp; promote ${esc(sel.candidate)}</button>`}
    </div>`;
}

/* ---- 9. export ---- */
function stExport(){
  const e=RUN.evidenceTrail;
  evReset();
  ev('Human','human','DesignRun',`Complete run assembled: problem, candidates, verdicts, FEA, feedback, selection.`,[e.schemaVersion]);
  if(exported) ev('Human','human','retained',`Bundle written for <b>${esc(RUN.selection.candidate)}</b>. Byte-stable, offline-replayable.`,[e.runId]);
  const rows=e.artifacts.map(a=>`<tr><td>${esc(a.kind)}</td><td class="mono small">${esc(a.path)}</td>
     <td class="r mono small">${esc(a.hash)}</td><td class="r num">${a.sizeKb} KB</td><td class="r muted">${esc(a.units)}</td></tr>`).join('');
  return `${approved?'':`<div class="callout warn" style="margin-bottom:14px"><div class="h">Not yet approved</div>
     Approve the design in the previous step before exporting the retained bundle.</div>`}
    <div class="card"><div class="card-h"><span class="t-label">Evidence trail — hash-addressed artifacts</span>
      <span class="tag mono">${esc(e.runId)}</span></div>
    <div class="card-b" style="padding-top:6px"><table class="mt">
      <thead><tr><th>artifact</th><th>path</th><th class="r">hash</th><th class="r">size</th><th class="r">units</th></tr></thead>
      <tbody>${rows}</tbody></table>
      <div class="t-label" style="margin:16px 0 6px">Offline replay</div>
      <div class="viewer" style="background:var(--bg);padding:11px 13px"><code class="mono small" style="color:var(--ink-2)">$ ${esc(e.offlineReplay)}</code></div>
    </div></div>
    <div class="approve-box ${exported?'done':''}" id="exportBox">
      <div class="txt">${exported
        ? `<b>Retained.</b> ${esc(RUN.selection.candidate)}.step + full evidence bundle written under <span class="mono">.artifacts/</span>. Nothing left the GB10.`
        : `<b>Export the chosen design.</b> Retain ${esc(RUN.selection.candidate)}.step and its complete evidence trail as a byte-stable bundle.`}</div>
      ${exported?'<span class="tag pass">✓ retained</span>'
        :`<button class="btn btn--primary" id="exportBtn" ${approved?'':'disabled'}>Export &amp; retain bundle</button>`}
    </div>`;
}

/* =====================================================================
   CONTROLLER
   ===================================================================== */
function renderSteps(){
  const groups=[]; let cur=null;
  STEPS.forEach((s,i)=>{ if(!cur||cur.g!==s.g){cur={g:s.g,stage:s.stage,items:[]};groups.push(cur);} cur.items.push({s,i}); });
  $('#steps').innerHTML=groups.map(gr=>`<div class="grp" data-stage="${gr.stage}">
    <div class="grp-label"><span class="dot"></span><span class="t-label">${esc(gr.g)}</span></div>
    ${gr.items.map(({s,i})=>`<div class="step ${i===idx?'active':''} ${i<idx?'done':''}" data-i="${i}">
      <span class="idx">${i<idx?'✓':i+1}</span>
      <div><div class="st-t">${esc(s.t)}</div><div class="st-d">${esc(s.d)}</div></div></div>`).join('')}
  </div>`).join('');
}
function paint(){
  const s=STEPS[idx];
  $('#stTitle').textContent=s.t;
  $('#stMoment').innerHTML=s.moment?`<span class="moment">◆ ${s.moment}</span>`:'';
  $('#stSub').textContent=SUBS[idx];
  $('#stBody').innerHTML=s.fn();
  renderSteps();
  $('#prev').disabled=idx===0;
  $('#next').disabled=idx===STEPS.length-1;
  $('#next').textContent=idx===STEPS.length-1?'Done':'Next →';
  const ab=$('#approveBtn'); if(ab) ab.onclick=()=>{approved=true;paint();};
  const eb=$('#exportBtn'); if(eb) eb.onclick=()=>{exported=true;paint();};
}
const SUBS=[
 'The private race assembly and the one bounded structural component we optimize.',
 'A versioned DesignProblem: objective, safety constraint, protected interfaces, supports and loads.',
 'PhysGen proposes a coherent topology family from the baseline — each traceable, none certified.',
 'Deterministic checks reject a plausible-looking but invalid design, with the measured reason shown.',
 'Every survivor faces the same FEA fixture and is ranked against the original component.',
 'One weak survivor is revised from actual Track feedback, then re-checked and re-scored.',
 'Baseline, parent, revised design, the failure, and the finalists — side by side.',
 'A human promotes the final design. The system reports evidence; it does not certify the part.',
 'Retain the chosen CAD artifact and its complete, hash-addressed evidence trail — offline.',
];
$('#next').onclick=()=>{ if(idx<STEPS.length-1){idx++;paint();} };
$('#prev').onclick=()=>{ if(idx>0){idx--;paint();} };
$('#steps').onclick=e=>{const el=e.target.closest('.step'); if(el){idx=+el.dataset.i;paint();}};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){$('#next').click();} if(e.key==='ArrowLeft'){$('#prev').click();}});
paint();
</script>
</body>
